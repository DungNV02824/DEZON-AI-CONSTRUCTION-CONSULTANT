[project]
name = "dezon-ai-consultant"
version = "0.1.0"
description = "Dezon AI Construction Consultant — khái toán xây dựng & tư vấn chọn nhà thầu"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pgvector>=0.3",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "redis>=5.0",
  "rq>=1.16",
  "beautifulsoup4>=4.12",
  "openpyxl>=3.1",
  "anthropic>=0.40",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
crawler = ["playwright>=1.45"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: test cần PostgreSQL (tự bỏ qua nếu không kết nối được)",
  "live_llm: test gọi LLM thật (bật bằng RUN_LIVE_LLM=1)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
